spring.application.name=ckennedy-api

# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ckennedy_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:ckennedy_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${CKENNEDY_DB_PASSWORD:}}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Server
server.port=${PORT:8080}

# JWT
app.jwt.secret=${CKENNEDY_JWT_SECRET}
app.jwt.expiration=86400000

# Upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.upload.directory=${UPLOAD_DIR:uploads}