spring.application.name=ckennedy-api

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/ckennedy_db
spring.datasource.username=ckennedy_user
spring.datasource.password=${CKENNEDY_DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Server
server.port=8080

# JWT
app.jwt.secret=ckennedy-development-secret-key-2026-secure
app.jwt.expiration=86400000

# Upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

app.upload.directory=uploads